; QGC 5.0.8을 시작할 때마다 컨테이너의 사용자 INI로 복사하는 기본 설정 파일입니다.
; 실행 중 변경한 설정은 컨테이너 내부에만 저장되어 컨테이너를 삭제하면 함께 사라집니다.
; SettingsVersion은 QGC가 현재 버전으로 직접 기록하도록 생략합니다.

; General: QGC의 일반 설정을 정의합니다.
[General]
; audioMuted: false이면 QGC의 음성 안내를 활성화합니다.
audioMuted=false

; AutoConnect: PX4 SITL과 통신하는 MAVLink UDP 자동 연결을 설정합니다.
[AutoConnect]
; autoConnectUDP: true이면 UDP에서 발견한 기체에 자동 연결합니다.
autoConnectUDP=true
; udpListenPort: PX4 SITL의 MAVLink 메시지를 수신하는 UDP 포트입니다.
udpListenPort=14550
