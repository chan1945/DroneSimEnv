; QGC 5.0.8을 시작할 때마다 컨테이너의 사용자 INI로 복사하는 기본 설정 파일입니다.
; 실행 중 변경한 설정은 컨테이너 내부에만 저장되어 컨테이너를 삭제하면 함께 사라집니다.
; SettingsVersion은 QGC가 현재 버전으로 직접 기록하도록 생략합니다.

; General: QGC의 일반 설정을 정의합니다.
[General]
; audioMuted: false이면 QGC의 음성 안내를 활성화합니다.
audioMuted=false
; offlineEditingFirmwareClass: 오프라인 임무 계획의 기본 펌웨어를 PX4로 지정합니다.
offlineEditingFirmwareClass=12
; offlineEditingVehicleClass: 오프라인 임무 계획의 기본 기체를 멀티콥터로 지정합니다.
offlineEditingVehicleClass=2
; firstRunPromptIdsShown: 단위(1)·기체 정보(2) 초기 안내를 이미 확인한 것으로 처리해 표시하지 않습니다.
; 쉼표 목록은 Qt가 문자열로 읽도록 큰따옴표로 감쌉니다.
firstRunPromptIdsShown="1,2"

; AutoConnect: PX4 SITL과 통신하는 MAVLink UDP 자동 연결을 설정합니다.
[AutoConnect]
; autoConnectUDP: true이면 UDP에서 발견한 기체에 자동 연결합니다.
autoConnectUDP=true
; udpListenPort: PX4 SITL의 MAVLink 메시지를 수신하는 UDP 포트입니다.
udpListenPort=14550

; Units: QGC에서 표시할 거리를 비롯한 단위를 미터법으로 지정합니다.
[Units]
; horizontalDistanceUnits: 수평 거리를 미터(m)로 표시합니다.
horizontalDistanceUnits=1
; verticalDistanceUnits: 고도를 미터(m)로 표시합니다.
verticalDistanceUnits=1
; areaUnits: 면적을 제곱미터(m²)로 표시합니다.
areaUnits=1
; speedUnits: 속도를 초당 미터(m/s)로 표시합니다.
speedUnits=1
; temperatureUnits: 온도를 섭씨(°C)로 표시합니다.
temperatureUnits=0
; weightUnits: 무게를 킬로그램(kg)으로 표시합니다.
weightUnits=1
