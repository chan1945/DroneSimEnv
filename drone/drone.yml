# Drone 컨테이너에서 DDS Agent 로그와 작업용 셸을 좌우로 나누는 tmuxinator 프로젝트 파일입니다.
# Docker ENTRYPOINT가 이 파일을 읽어 세션을 만들고 sim_run.sh의 xterm이 같은 세션에 접속합니다.

# name: 서비스 이름과 동일한 drone 세션을 사용해 터미널 재접속 시 기존 화면에 연결합니다.
name: drone
# root: 두 pane의 시작 경로를 Drone ROS 2 workspace로 지정합니다.
root: /DroneSimEnv/drone_ws
# startup_window: 컨테이너 시작 후 두 pane을 포함한 main 창을 선택합니다.
startup_window: main
# startup_pane: 0부터 세는 pane 인덱스 1을 선택해 오른쪽 작업용 셸에 입력 포커스를 둡니다.
startup_pane: 1
# enable_pane_titles: 각 pane에 agent와 shell 이름을 표시해 실행 로그와 작업 영역을 구분합니다.
enable_pane_titles: true

# on_project_start: 로그인 셸을 만들기 전에 GPU 런타임이 주입한 미등록 그룹 이름을 추가합니다.
# group_id: 현재 프로세스와 PID 1의 숫자 GID를 순회하며 이름이 없을 때만 host-gid-<GID>를 등록합니다.
# PID 1도 조회해 root 권한으로 시작한 실행 경로에서 GPU 보조 그룹이 빠지는 경우를 처리합니다.
on_project_start: for group_id in $(id -G) $(sed -n "s/^Groups:[[:space:]]*//p" /proc/1/status); do if ! getent group "$group_id" >/dev/null; then groupadd --gid "$group_id" "host-gid-$group_id"; fi; done

# windows: main 창 하나에 Agent용 pane과 대화형 셸 pane을 순서대로 생성합니다.
windows:
  # main: Drone의 기본 작업 창이며 두 pane의 레이아웃과 실행 명령을 함께 정의합니다.
  - main:
      # layout: 두 pane을 같은 폭으로 좌우 배치해 Agent 로그와 셸을 동시에 볼 수 있게 합니다.
      layout: even-horizontal
      # panes: 첫 pane에서 Agent를 실행하고 두 번째 pane에는 기본 셸을 남깁니다.
      panes:
        # agent: PX4 DDS 클라이언트의 기본 UDP 포트 8888에서 Agent를 전경 실행해 로그를 표시합니다.
        # 명령이 종료되면 pane의 셸이 유지되므로 실패 내용을 확인하고 수동으로 재실행할 수 있습니다.
        - agent: MicroXRCEAgent udp4 -p 8888
        # shell: 실행 명령을 비워 ROS 환경을 로드한 기본 대화형 셸을 작업용으로 사용합니다.
        - shell:
